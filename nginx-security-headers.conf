add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features the app never uses are switched off for this origin and
# every frame it embeds, so an injected script cannot ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# A cross-origin page this app opens, or that opens it, gets no window
# reference to it. The theme editor popup is same-origin and keeps its own.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Strict-Transport-Security is not set here: this server speaks plain http
# behind the TLS proxy, which must send it (INSTALL.md of the umbrella
# repository, the TLS point of section 2 and B5).
