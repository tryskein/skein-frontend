name: Theme mirror

# skein-frontend/src/lib/themeTokens.ts and themeMigration.ts are mirrored in
# skein-api (internal/themes). The umbrella script compares the two. It needs
# the three repositories side by side, so this job checks them out into the
# layout the script expects:
#
#   skein/                       tryskein/skein (the script lives here)
#   skein/projects/skein-frontend  this repository
#   skein/projects/skein-api       tryskein/skein-api, main
#
# This workflow has its own file, and is not called from the release workflow,
# so that the `paths` filter below applies.

on:
  pull_request:
    paths:
      - src/lib/themeTokens.ts
      - src/lib/themeMigration.ts
      - .github/workflows/theme-mirror.yml
  push:
    branches: [main]
    paths:
      - src/lib/themeTokens.ts
      - src/lib/themeMigration.ts
      - .github/workflows/theme-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-mirror-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  theme-mirror:
    name: Frontend and backend theme registries agree
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the umbrella repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tryskein/skein
          ref: main
          path: skein
      - name: Check out this repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: skein/projects/skein-frontend
      - name: Check out skein-api
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tryskein/skein-api
          ref: main
          path: skein/projects/skein-api
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
      # With a Go toolchain the script first proves that the backend golden
      # files still equal the live Go catalogue; without it, it only warns.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: skein/projects/skein-api/src/go.mod
          cache-dependency-path: skein/projects/skein-api/src/go.sum
      - name: Compare the registries
        working-directory: skein
        run: ./scripts/check-theme-mirror.sh
