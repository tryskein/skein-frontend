name: Release

# A final release tag X.Y.Z (digits only) publishes the image
# ghcr.io/tryskein/skein-frontend:X.Y.Z and :latest, then creates a GitHub
# Release. Pre-release tags such as X.Y.Z-rc.N do not match the trigger and
# publish nothing.
#
# Publishing jobs are bound to the `release` environment; configure required
# reviewers on it in the repository settings.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tryskein/skein-frontend

jobs:
  gate:
    name: Tag gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Tag filters are globs, not regular expressions: re-check strictly.
      - name: Validate the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$TAG' is not a final release tag X.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not an ancestor of origin/main"
            exit 1
          fi

  test:
    name: Checks
    needs: gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: [gate, test]
    environment: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          labels: |
            org.opencontainers.image.source=https://github.com/tryskein/skein-frontend
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.created=${{ env.BUILD_TIME }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-arch image
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" -eq 2 ] || { echo "::error::expected 2 digests (amd64, arm64)"; ls; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Inspect the result
        env:
          TAG: ${{ github.ref_name }}
        run: docker buildx imagetools inspect "$IMAGE:$TAG"

  github-release:
    name: GitHub Release
    needs: merge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
