# ---- Access log without secret tokens (sk-674.18 T059) ----
# Some paths carry a secret token as a path segment: the SPA pages
# /invite/<token>, /reset-password/<token>, /confirm-email/<token>, and the
# API routes the SPA calls with it — /api/auth/invitations/<token>[/signup],
# /api/auth/password-reset/<token>, /api/auth/confirm-email/<token>
# (skein-web AccountController) and /api/v1/invitations/<token>[/accept|
# /decline] (skein-api, through the BFF proxy). Tokens are never written to
# logs (a secret does not belong in logs), so the access log of
# this server writes the URI with that segment replaced by «***», and
# carries neither $request (the raw request line) nor $http_referer (a page
# URL, possibly with a token). Every other request is logged as before, by
# its full URI. These two directives live outside `server` because this
# file is included in the `http` context (conf.d/default.conf).
map $request_uri $skein_log_uri {
    ~^(?<skein_tok_head>/(?:invite|reset-password|confirm-email)/)[^/?#]+(?<skein_tok_tail>.*)$                   $skein_tok_head***$skein_tok_tail;
    ~^(?<skein_tok_head>/api/auth/(?:invitations|password-reset|confirm-email)/)[^/?#]+(?<skein_tok_tail>.*)$     $skein_tok_head***$skein_tok_tail;
    ~^(?<skein_tok_head>/api/v1/invitations/)[^/?#]+(?<skein_tok_tail>.*)$                                        $skein_tok_head***$skein_tok_tail;
    default                                                                                                       $request_uri;
}

log_format skein_masked '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $skein_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_user_agent"';

# ---- Scheme the client used (sk-749) ----------------------------------
# TLS normally ends on a proxy in front of this server, which talks plain
# http to it, so $scheme is always `http` here. Passing that on made
# skein-web believe the request was not https (session cookie without
# Secure, an http OIDC redirect). When the proxy in front says `https` or
# `http` in X-Forwarded-Proto, that value is passed on; any other value, or
# none (a direct request), falls back to this server's own scheme. Only the
# two valid schemes are accepted, so a client cannot inject anything else.
# The sender is NOT checked: the proxy in front must overwrite this header
# with the scheme the client really used, and outside local development this
# server must not be reachable except through that proxy. Otherwise a client
# picks the scheme skein-web sees.
map $http_x_forwarded_proto $skein_forwarded_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen 5102;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The masked format above for every location of this server.
    access_log /var/log/nginx/access.log skein_masked;

    # Security headers — server-level inherits into location blocks
    # that have no add_header of their own. Locations that DO set
    # their own headers must include the snippet explicitly, else
    # nginx stops inheriting server-level add_header in that block.
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml
        application/wasm;

    # ---- Health ------------------------------------------------------
    # Liveness probe target. K8s readinessProbe / liveness use this; the
    # nginx process is alive iff this returns 200.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ---- Cache-busted resources --------------------------------------
    # /version.json carries the deployed image tag, polled by the SPA
    # every 60s for the update-available banner. Never cache it —
    # neither browser nor any intermediate proxy.
    location = /version.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # index.html — never cached so rollouts land atomically. The bundle
    # is fingerprinted in /assets/, so HTML always points at the
    # currently-served hashes.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # Service worker — NOT fingerprinted and lives at root so its scope
    # covers the whole app. Must never be cached immutably or SW updates
    # (push handler changes) can be stranded for up to a year. Exact-match
    # location outranks the .js regex below, so this wins for /sw.js.
    # Service-Worker-Allowed lets the SW claim root scope when served here.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        expires 0;
        try_files $uri =404;
    }

    # Fingerprinted assets — immutable. Vite emits content-hashed names
    # so a different file means a different URL.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|ico|gif|webp|wasm)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ---- Backend proxies --------------------------------------------
    # Local-compose convenience: nginx proxies /api, /hub, /oauth2 to
    # the skein-web BFF service so the whole stack stays behind a
    # single host:port. In production these paths are routed by the
    # k8s ingress directly to skein-web — nginx never sees them, so
    # these blocks act as a no-op in that environment.
    #
    # SKEIN_BFF_URL is templated by `envsubst` at container start
    # (entrypoint hook) so dev / staging / prod can point at different
    # internal hostnames without rebuilding the image.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # API routes with a secret token in the path (sk-674.18 T059, review
    # fe/5 #1): /api/auth/{invitations,password-reset,confirm-email}/<token>
    # (skein-web AccountController) and /api/v1/invitations/<token>[/accept|
    # /decline] (skein-api through the BFF). Proxied exactly like /api/
    # above; what differs is the error log. The access log already masks the
    # token (`skein_masked`), but nginx's error-log format cannot be
    # configured: an upstream failure (connect refused, timeout) writes the
    # request line, the upstream URL and the referrer — token included. So
    # these paths log only `crit`: a 502 on them is still in the masked
    # access log and in skein-web's own logs, and the token is never written
    # (lead's decision (a), sk-674.18). A regex location, so it wins over the
    # `/api/` prefix; no asset regex can match these paths.
    location ~ ^/api/(?:auth/(?:invitations|password-reset|confirm-email)|v1/invitations)/ {
        include /etc/nginx/snippets/security-headers.conf;
        error_log /dev/stderr crit;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # MCP — streamable HTTP transport for the agent protocol. Forwarded
    # to skein-web's McpProxyMiddleware, which in turn pipes to skein-api.
    # X-Skein-Api-Key is the auth carrier (NOT cookies), so we leave the
    # request untouched. `proxy_buffering off` keeps the streamed JSON-RPC
    # frames flowing without nginx batching them. Long read timeout matches
    # /hub since some MCP tools (long-running searches) hold the
    # response open.
    #
    # Prefix match (no `=`) so both /mcp AND /mcp/ are caught — skein-web's
    # McpProxyMiddleware accepts both forms. The exact-match form misses
    # the trailing-slash variant and clients fall through to the SPA's
    # index.html (200 HTML, which the MCP client cannot parse).
    location /mcp {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Agent data-plane (sk-744): /agent/v1/* is the "second door" of skein-api,
    # reached by agents with a monitor token in X-Skein-Api-Key, through
    # skein-web's AgentProxyMiddleware. SKEIN_AGENT_PUBLIC_URL points at this
    # server, so without these blocks the request falls through to
    # `location /` and the agent gets the SPA's index.html (200 HTML).
    # `^~` so the asset regex above cannot take a path ending in .js or the
    # like (e.g. /agent/v1/monitor-script.js); the exact form covers the bare
    # /agent/v1 and nothing else, so /agent/v10 stays with the SPA fallback.
    # The poll endpoint can be a long-poll, hence no buffering and the same
    # long timeouts as /mcp.
    location = /agent/v1 {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /agent/v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OAuth 2.0 Protected Resource Metadata for the MCP door (sk-304,
    # RFC 9728 §3 root + §3.1 path-aware). Forwarded to skein-web, which
    # passes it to skein-api — the single owner of the document.
    #
    # Needed here because this nginx is the public entrypoint wherever the
    # SPA image fronts the stack (the local compose points
    # SKEIN_AGENT_PUBLIC_URL at it). Without these blocks the request falls
    # through to `location /` and an MCP client asking for its metadata gets
    # the SPA's index.html: 200 OK, HTML body, discovery dead — the same
    # class of failure as the /mcp trailing-slash note above.
    #
    # Unauthenticated by design: a client reads the document precisely
    # because it does not yet know how to authenticate. Prefix match is NOT
    # used — `= ` on both forms — so no other /.well-known/* document can be
    # captured by accident.
    location = /.well-known/oauth-protected-resource {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
    }

    # SignalR Hub — WebSocket upgrade required. Same proxy_pass target
    # but with Upgrade headers + long read timeout to keep the socket
    # alive between heartbeats.
    location = /hub {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }
    # /hub/negotiate (POST, normal HTTP) + /hub?id=… (long-poll
    # fallback) — same backend, no Upgrade required.
    location /hub/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # OAuth2 paths — only reached in keycloak mode (R5.1). In local
    # mode oauth2-proxy isn't running and these paths 404 cleanly.
    location /oauth2/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass         http://skein-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $skein_forwarded_proto;
    }

    # ---- Pages with a token in the address (sk-674.18 T059) --------
    # /invite/<token>, /reset-password/<token>, /confirm-email/<token> are
    # SPA routes whose path is a secret: they get their own headers —
    # Referrer-Policy: no-referrer and a CSP (token-page-headers.conf).
    #
    # `^~` so the asset regex above cannot take such a path. The document
    # is served by `try_files /index.html =404` IN this block: the file is
    # tried as a file, not an internal redirect, so the response keeps
    # these headers — a redirect to /index.html would land in the
    # `location = /index.html` block and go out with its headers instead.
    location ^~ /invite/ {
        include /etc/nginx/snippets/token-page-headers.conf;
        # The error log writes the request line (see the token API block).
        error_log /dev/stderr crit;
        expires 0;
        try_files /index.html =404;
    }

    location ^~ /reset-password/ {
        include /etc/nginx/snippets/token-page-headers.conf;
        # The error log writes the request line (see the token API block).
        error_log /dev/stderr crit;
        expires 0;
        try_files /index.html =404;
    }

    location ^~ /confirm-email/ {
        include /etc/nginx/snippets/token-page-headers.conf;
        # The error log writes the request line (see the token API block).
        error_log /dev/stderr crit;
        expires 0;
        try_files /index.html =404;
    }

    # ---- SPA fallback -----------------------------------------------
    # Everything else is React Router territory — serve index.html and
    # let the SPA handle the path. Server-level security headers
    # apply via inheritance (no add_header in this block).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
