# sk-674.18 T059 — headers of the pages whose address carries a secret
# token: /invite/<token>, /reset-password/<token>, /confirm-email/<token>.
#
# A location that sets its own add_header stops inheriting the
# server-level ones, so this snippet restates the two other headers of
# security-headers.conf and replaces its Referrer-Policy — two
# Referrer-Policy headers on one response would leave the policy to the
# browser's reading of the pair.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# The token must not leave in a Referer header: not to the Turnstile
# script and frame on challenges.cloudflare.com, not to a terms or privacy
# link opened from the registration form, not even to this origin's own
# API.
add_header Referrer-Policy "no-referrer" always;

# What the SPA needs on these pages and nothing else:
#  - scripts: the bundle and theme-boot.js from this origin, Turnstile's
#    api.js (Cloudflare: script-src and frame-src https://challenges.cloudflare.com);
#  - styles: the bundle, Mantine's inline style attributes, and the Google
#    Fonts stylesheet a user theme may add (lib/themeRuntime.ts);
#  - requests: this origin only (the BFF behind /api).
# The pages leave for the app with a document load, so the app itself is
# never run under this policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# The document is index.html: never cached, like the index.html location.
add_header Cache-Control "no-cache, no-store, must-revalidate" always;
